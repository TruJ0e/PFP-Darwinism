[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfp-darwinism"
version = "0.7.0"
description = "Pass, Fail, Possible — survival of the fittest reasoning on parallel Nemotron inference."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []  # stdlib only: urllib, threading, concurrent.futures

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[tool.setuptools]
packages = ["pfp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
